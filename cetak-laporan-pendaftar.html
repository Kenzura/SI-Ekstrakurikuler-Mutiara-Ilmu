<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Calon Pendaftar - SMK Mutiara Ilmu</title>
    <link rel="shortcut icon" href="assets/images/logo1.png" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/demo-nav.css">
    <style>
        body {
            font-family: Arial, "Helvetica Neue", Helvetica, sans-serif;
            margin: 0;
            padding: 30px;
            background: #f8fafc;
            color: #000;
        }
        .container {
            max-width: 960px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
        }
        .top-bar {
            max-width: 960px;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .btn-action {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
            border: none;
        }
        .btn-back { background: #e2e8f0; color: #1e293b; }
        .btn-print { background: #16a34a; color: white; }
        .header {
            text-align: center;
            border-bottom: 2px solid #000;
            padding-bottom: 12px;
            margin-bottom: 25px;
        }
        .header h3 { margin: 0 0 4px 0; font-size: 15px; font-weight: normal; }
        .header h2 { margin: 0 0 6px 0; font-size: 20px; font-weight: bold; }
        .header h4 { margin: 4px 0; font-size: 16px; color: #d97706; }
        .header p { margin: 0; font-size: 12px; color: #555; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
            font-size: 12px;
        }
        th, td {
            border: 1px solid #000;
            padding: 7px 10px;
        }
        th {
            background-color: #f1f5f9;
            text-align: left;
        }
        .signature-section {
            margin-top: 40px;
            display: flex;
            justify-content: flex-end;
        }
        .sign-box {
            text-align: center;
            width: 240px;
            font-size: 13px;
        }
        .sign-space { height: 75px; }

        @media print {
            body { background: white; padding: 0; }
            .container { border: none; padding: 0; max-width: 100%; }
            .top-bar, #mutil-demo-dock { display: none !important; }
        }
    </style>
</head>
<body>
    <div class="top-bar">
        <a href="pembina-pendaftar.html" class="btn-action btn-back">
            <i class="fas fa-arrow-left"></i> Kembali ke Panel Pembina
        </a>
        <button class="btn-action btn-print" onclick="window.print()">
            <i class="fas fa-print"></i> Cetak Dokumen / PDF
        </button>
    </div>

    <div class="container">
        <div class="header">
            <h3>SMK MUTIARA ILMU MAKASSAR</h3>
            <h2>LAPORAN DATA CALON PENDAFTAR EKSTRAKURIKULER</h2>
            <h4 id="reportEkskulName">ART MEDIA</h4>
            <p>Tanggal Cetak: <span id="reportPrintDate"></span></p>
        </div>

        <table>
            <thead>
                <tr>
                    <th width="5%" style="text-align: center;">No</th>
                    <th width="14%">NIS</th>
                    <th width="24%">Nama Siswa</th>
                    <th width="12%">Kelas</th>
                    <th width="12%">Jenis Kelamin</th>
                    <th width="15%">No HP / WA</th>
                    <th width="18%">Status Seleksi</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <!-- Dynamically populated -->
            </tbody>
        </table>

        <div class="signature-section">
            <div class="sign-box">
                <div>Makassar, <span id="signDate"></span></div>
                <div>Pembina Ekstrakurikuler,</div>
                <div class="sign-space"></div>
                <div style="font-weight: bold; text-decoration: underline;" id="signPembinaName">Budi Santoso, S.Kom</div>
                <div style="font-size: 11px; color: #555;">NIP/NUPTK: 19850412 201001 1 014</div>
            </div>
        </div>
    </div>

    <script src="assets/js/data-store.js"></script>
    <script src="assets/js/demo-nav.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            if (!window.MutilStore) return;
            const ekskulId = sessionStorage.getItem('mutil_pembina_ekskul_id') || '1';
            const ekskul = window.MutilStore.getEkskulById(ekskulId);
            const dateStr = new Date().toLocaleDateString('id-ID', { day: 'numeric', month: 'long', year: 'numeric' });
            
            document.getElementById('reportPrintDate').innerText = dateStr;
            document.getElementById('signDate').innerText = dateStr;

            if (ekskul) {
                document.getElementById('reportEkskulName').innerText = ekskul.nama_ekskul;
                document.getElementById('signPembinaName').innerText = ekskul.pembina;
            }

            const applicants = window.MutilStore.getPendaftarByEkskul(ekskulId);
            const tbody = document.getElementById('reportTableBody');

            if (applicants.length === 0) {
                tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Tidak ada data pendaftar.</td></tr>`;
            } else {
                tbody.innerHTML = applicants.map((p, idx) => `
                    <tr>
                        <td style="text-align: center;">${idx + 1}</td>
                        <td>${p.nis}</td>
                        <td><strong>${p.nama_lengkap}</strong></td>
                        <td>${p.kelas}</td>
                        <td>${p.jenis_kelamin}</td>
                        <td>${p.no_hp || '-'}</td>
                        <td><strong style="text-transform: uppercase;">${p.status}</strong></td>
                    </tr>
                `).join('');
            }
        });
    </script>
</body>
</html>

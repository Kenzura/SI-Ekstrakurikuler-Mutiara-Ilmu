<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Login - Ekstrakurikuler Mutiara Ilmu</title>
    <link rel="stylesheet" href="assets/vendors/feather/feather.css">
    <link rel="stylesheet" href="assets/vendors/ti-icons/css/themify-icons.css">
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/demo-nav.css">
    <link rel="shortcut icon" href="assets/images/logo1.png" />
    <style>
        .btn-back-top-left {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 1000;
            background-color: #57B657;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 12px rgba(87, 182, 87, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-back-top-left:hover {
            background-color: #48a048;
            color: white;
            transform: translateY(-2px);
        }
        .demo-quick-box {
            background: #f0fdf4;
            border: 1px dashed #22c55e;
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 20px;
        }
        .demo-quick-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            padding: 8px 12px;
            margin-bottom: 6px;
            border-radius: 6px;
            border: 1px solid #bbf7d0;
            background: #ffffff;
            color: #166534;
            font-weight: 500;
            font-size: 13px;
            text-decoration: none !important;
            transition: all 0.2s;
        }
        .demo-quick-btn:hover {
            background: #22c55e;
            color: #ffffff;
            border-color: #22c55e;
            transform: translateX(3px);
        }
    </style>
</head>
<body>
    <a href="index.html" class="btn-back-top-left">
        <i class="fas fa-arrow-left me-2"></i> Kembali ke Beranda
    </a>
    <div class="container-scroller">
        <div class="container-fluid page-body-wrapper full-page-wrapper">
            <div class="content-wrapper d-flex align-items-center auth px-0" style="min-height: 100vh; background: linear-gradient(135deg, #f0fdf4 0%, #e2e8f0 100%);">
                <div class="row w-100 mx-0">
                    <div class="col-lg-4 col-md-6 mx-auto">
                        <div class="auth-form-light text-left py-5 px-4 px-sm-5 rounded-4 shadow-sm" style="background: #ffffff;">
                            <div class="brand-logo text-center mb-4">
                                <img src="assets/images/logo.png" alt="logo" style="width: 230px;">
                            </div>
                            <h4 class="font-weight-bold text-dark">Halo! Selamat Datang 👋</h4>
                            <h6 class="font-weight-light text-muted mb-4">Silakan login untuk mengakses sistem ekstrakurikuler.</h6>

                            <!-- Quick Demo Login Helpers -->
                            <div class="demo-quick-box">
                                <div class="d-flex align-items-center gap-2 mb-2">
                                    <i class="fas fa-bolt text-warning"></i>
                                    <strong style="font-size: 13px; color: #15803d;">Masuk Cepat Demo:</strong>
                                </div>
                                <a href="siswa-dashboard.html" class="demo-quick-btn">
                                    <span>🎓 <strong>Login sebagai Siswa</strong> (Fadhil)</span>
                                    <i class="fas fa-arrow-right"></i>
                                </a>
                                <a href="pembina-dashboard.html" class="demo-quick-btn">
                                    <span>🛡️ <strong>Login Pembina</strong> (Art Media)</span>
                                    <i class="fas fa-arrow-right"></i>
                                </a>
                                <a href="admin-dashboard.html" class="demo-quick-btn">
                                    <span>👑 <strong>Login Super Admin</strong> (Admin Utama)</span>
                                    <i class="fas fa-arrow-right"></i>
                                </a>
                            </div>

                            <form id="loginForm" class="pt-2">
                                <div class="form-group mb-3">
                                    <label class="form-label text-muted small fw-bold">Email / Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                        <input type="text" id="loginEmail" class="form-control form-control-lg border-start-0" placeholder="fadhil@siswa.mutil.sch.id" value="fadhil@siswa.mutil.sch.id" required>
                                    </div>
                                </div>
                                <div class="form-group mb-3">
                                    <label class="form-label text-muted small fw-bold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                        <input type="password" id="loginPass" class="form-control form-control-lg border-start-0" placeholder="••••••••" value="password" required>
                                    </div>
                                </div>
                                <div class="form-group mb-4">
                                    <label class="form-label text-muted small fw-bold">Pilih Role Akses</label>
                                    <select id="loginRole" class="form-control form-control-lg bg-light">
                                        <option value="siswa" selected>Siswa (Pendaftar Ekskul)</option>
                                        <option value="pembina">Pembina Ekstrakurikuler</option>
                                        <option value="admin">Super Admin Sekolah</option>
                                    </select>
                                </div>
                                <div class="mt-3 d-grid gap-2">
                                    <button class="btn btn-block btn-success text-white btn-lg font-weight-medium auth-form-btn" type="submit">
                                        <i class="fas fa-right-to-bracket me-2"></i> Log In
                                    </button>
                                </div>
                                <div class="text-center mt-4 font-weight-light text-muted">
                                    Belum Punya Akun? <a href="register.html" class="text-success fw-bold">Register Siswa</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/vendors/js/vendor.bundle.base.js"></script>
    <script src="assets/js/data-store.js"></script>
    <script src="assets/js/demo-nav.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const role = document.getElementById('loginRole').value;
            window.showMutilToast('Login berhasil sebagai ' + role.toUpperCase() + '!');
            setTimeout(function() {
                if (role === 'pembina') {
                    window.location.href = 'pembina-dashboard.html';
                } else if (role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'siswa-dashboard.html';
                }
            }, 500);
        });
    </script>
</body>
</html>

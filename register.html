<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
    <title>Register - Ekstrakurikuler Mutiara Ilmu</title>
    <link rel="stylesheet" href="assets/vendors/feather/feather.css">
    <link rel="stylesheet" href="assets/vendors/ti-icons/css/themify-icons.css">
    <link rel="stylesheet" href="assets/vendors/css/vendor.bundle.base.css">
    <link rel="stylesheet" href="assets/vendors/mdi/css/materialdesignicons.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/demo-nav.css">
    <link rel="shortcut icon" href="assets/images/logo1.png" />
    <style>
        .btn-back-top-left {
            position: fixed;
            top: 15px;
            left: 20px;
            z-index: 1000;
            background-color: #57B657;
            color: white;
            border: none;
            border-radius: 8px;
            padding: 8px 16px;
            font-size: 14px;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            box-shadow: 0 4px 12px rgba(87, 182, 87, 0.3);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-back-top-left:hover {
            background-color: #48a048;
            color: white;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <a href="login.html" class="btn-back-top-left">
        <i class="fas fa-arrow-left me-2"></i> Kembali ke Login
    </a>
    <div class="container-scroller">
        <div class="container-fluid page-body-wrapper full-page-wrapper">
            <div class="content-wrapper d-flex align-items-center auth px-0" style="min-height: 100vh; background: linear-gradient(135deg, #f0fdf4 0%, #e2e8f0 100%);">
                <div class="row w-100 mx-0">
                    <div class="col-lg-4 col-md-6 mx-auto">
                        <div class="auth-form-light text-left py-5 px-4 px-sm-5 rounded-4 shadow-sm" style="background: #ffffff;">
                            <div class="brand-logo text-center mb-4">
                                <img src="assets/images/logo.png" alt="logo" style="width: 230px;">
                            </div>
                            <h4 class="font-weight-bold text-dark">Baru di Sini? 🌟</h4>
                            <h6 class="font-weight-light text-muted mb-4">Daftarkan akun siswa untuk mulai memilih ekstrakurikuler favoritmu.</h6>
                            
                            <form id="regisForm" class="pt-2">
                                <div class="form-group mb-3">
                                    <label class="form-label text-muted small fw-bold">Alamat Email</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-envelope text-muted"></i></span>
                                        <input type="email" id="regEmail" class="form-control form-control-lg border-start-0" placeholder="nama@siswa.mutil.sch.id" required>
                                    </div>
                                </div>
                                <div class="form-group mb-3">
                                    <label class="form-label text-muted small fw-bold">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-user text-muted"></i></span>
                                        <input type="text" id="regUser" class="form-control form-control-lg border-start-0" placeholder="username_siswa" required>
                                    </div>
                                </div>
                                <div class="form-group mb-4">
                                    <label class="form-label text-muted small fw-bold">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light border-end-0"><i class="fas fa-lock text-muted"></i></span>
                                        <input type="password" id="regPass" class="form-control form-control-lg border-start-0" placeholder="Buat password aman" required>
                                    </div>
                                </div>
                                <div class="mt-3 d-grid gap-2">
                                    <button type="submit" class="btn btn-block btn-success text-white btn-lg font-weight-medium auth-form-btn">
                                        <i class="fas fa-user-plus me-2"></i> Buat Akun Siswa
                                    </button>
                                </div>
                                <div class="text-center mt-4 font-weight-light text-muted">
                                    Sudah Punya Akun? <a href="login.html" class="text-success fw-bold">Login</a>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="assets/vendors/js/vendor.bundle.base.js"></script>
    <script src="assets/js/data-store.js"></script>
    <script src="assets/js/demo-nav.js"></script>
    <script>
        document.getElementById('regisForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('regUser').value;
            const email = document.getElementById('regEmail').value;
            
            if (window.MutilStore) {
                window.MutilStore.updateCurrentUser({
                    username: username,
                    email: email,
                    nama_lengkap: username
                });
            }
            window.showMutilToast('Pendaftaran akun berhasil! Mengarahkan ke Dashboard Siswa...');
            setTimeout(function() {
                window.location.href = 'siswa-dashboard.html';
            }, 800);
        });
    </script>
</body>
</html>
